<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fragments - Artist Portfolio</title>
  <link rel="stylesheet" href="./style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/geist-sans@5.0.1/index.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/geist-mono@5.0.1/index.min.css" />
</head>

<body class="page-transition">

  <header>
    <a href="./" class="site-title">Yuwei Liu</a>
    <nav class="nav-links">
      <a href="./fragments.html" class="active">Fragments</a>
      <a href="./works.html">Works</a>
      <a href="./about.html">About</a>
    </nav>
  </header>

  <main class="container">
    <div class="grid-loose mt-xxl">

      <!-- Fragments are an unstructured diary -->
      <div class="col-8 start-3 mt-lg">
        <a href="https://www.youtube.com/watch?v=U1ut9zSQfAU" target="_blank" class="img-container"
          style="display: block; opacity: 1;">
          <img src="./images/bird_1.jpg" alt="A bird" />
        </a>
      </div>

      <div class="col-6 start-1 mt-xxl">
        <a href="https://www.youtube.com/watch?v=xbaFVcYnY7A" target="_blank" class="img-container"
          style="display: block; opacity: 1;">
          <img src="./images/night.png" alt="Night view" />
        </a>
      </div>

      <div class="col-4 start-8 mt-xl">
        <div class="img-container lightbox-trigger" data-type="image" data-src="./images/garden.png">
          <img src="./images/garden.png" alt="Summar garden" />
        </div>
      </div>

      <!-- Add one more scattered fragment for flow -->
      <div class="col-6 start-4 mt-xxl">
        <div class="img-container lightbox-trigger" data-type="image" data-src="./images/lcbo.png">
          <img src="./images/lcbo.png" alt="LCBO" style="filter: contrast(120%) brightness(0.9);" />
        </div>
      </div>

      <div class="col-6 start-2 mt-xxl">
        <div class="img-container lightbox-trigger" data-type="image" data-src="./images/cemetery.png">
          <img src="./images/cemetery.png" alt="cemetery" style="filter: contrast(120%) brightness(0.9);" />
        </div>
      </div>


      <div class="col-5 start-5 mt-xxl">
        <div class="img-container lightbox-trigger" data-type="image" data-src="./images/lake2.png">
          <img src="./images/lake2.png" alt="lake" style="filter: contrast(120%) brightness(0.9);" />
        </div>
      </div>




    </div>
  </main>

  <script src="/main.js" type="module"></script>
</body>

</html>
